<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTF Epsilon-11 "Nine-Tailed Fox" | SCP Foundation Terminal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #0088ff;
            --blue-hover: #0066cc;
            --blue-glow: rgba(0, 136, 255, 0.4);
            --bg-dark: #080a0f;
            --card-bg: #0f131d;
            --card-border: #1e2638;
            --text-main: #e6edf3;
            --text-muted: #8b949e;
            --danger-red: #ff3333;
            --red-glow: rgba(255, 51, 51, 0.4);
            --warning-amber: #ffaa00;
            --success-green: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 136, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(255, 51, 51, 0.03) 0%, transparent 40%);
        }

        /* Top Announcement Ticker */
        .holo-ticker {
            background: rgba(0, 136, 255, 0.1);
            border-bottom: 1px solid rgba(0, 136, 255, 0.3);
            color: var(--primary-blue);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 6px 0;
            overflow: hidden;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .holo-ticker-content {
            display: inline-block;
            animation: ticker 25s linear infinite;
        }

        @keyframes ticker {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        /* Navigation Header */
        header {
            background-color: rgba(15, 19, 29, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        nav button {
            background: none;
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        nav button:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        nav button.active {
            color: var(--text-main);
            background-color: var(--primary-blue);
            box-shadow: 0 0 12px var(--blue-glow);
            border-color: var(--primary-blue);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
        }

        .sound-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sound-toggle:hover {
            background: rgba(0, 136, 255, 0.2);
            box-shadow: 0 0 10px var(--blue-glow);
            color: var(--primary-blue);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 4px;
            border-radius: 2px;
            background: #1e2638;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary-blue);
            cursor: pointer;
            box-shadow: 0 0 8px var(--blue-glow);
        }

        /* Banner & Container */
        .to-banner {
            background: linear-gradient(90deg, rgba(0, 136, 255, 0.15) 0%, rgba(15, 19, 29, 0.95) 100%);
            border: 1px solid var(--primary-blue);
            border-radius: 10px;
            padding: 1.2rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 15px rgba(0, 136, 255, 0.2);
        }

        .to-info { display: flex; align-items: center; gap: 15px; }
        .to-icon { font-size: 2rem; color: var(--primary-blue); }
        .to-details h3 { font-size: 1.1rem; color: #fff; margin-bottom: 4px; text-transform: uppercase; }
        .to-details p { color: var(--text-muted); font-size: 0.9rem; }

        .container {
            max-width: 1150px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .tab-content { display: none; }
        .tab-content.active {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hero & Section Styles */
        .hero-card {
            position: relative;
            background: linear-gradient(180deg, rgba(8, 10, 15, 0.7) 0%, rgba(8, 10, 15, 0.98) 100%), 
                        url('https://static.wikia.nocookie.net/scp-wiki-de/images/e/ec/SCP_Foundation_Logo.png/revision/latest?cb=20180905183307') center center/contain no-repeat;
            border: 1px solid var(--primary-blue);
            border-radius: 12px;
            padding: 4rem 2.5rem 3rem 2.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 136, 255, 0.15);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: var(--primary-blue);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 4px;
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        .hero-card h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem; }
        .hero-card h1 span { color: var(--primary-blue); }
        .hero-card p { color: #d0d0d8; font-size: 1rem; line-height: 1.6; max-width: 750px; margin-bottom: 2rem; }

        .section-title { text-align: center; margin: 2rem 0 1.5rem 0; }
        .section-title h2 { font-size: 1.8rem; margin-bottom: 0.5rem; text-transform: uppercase; }
        .section-title p { color: var(--text-muted); font-size: 0.95rem; }

        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: var(--primary-blue);
            transform: translateY(-3px);
        }

        .card-icon { color: var(--primary-blue); font-size: 1.6rem; margin-bottom: 1rem; }
        .card h3 { margin-bottom: 0.5rem; font-size: 1.2rem; }
        .card p { color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }

        .equipment-list {
            margin-top: 10px;
            padding-left: 0;
            list-style: none;
        }

        .equipment-list li {
            font-size: 0.85rem;
            color: var(--text-main);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .equipment-list li i {
            color: var(--primary-blue);
            font-size: 0.8rem;
        }

        /* SCP Cards Styling */
        .scp-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-left: 4px solid var(--primary-blue);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .scp-card.keter { border-left-color: var(--danger-red); }
        .scp-card.euclid { border-left-color: var(--warning-amber); }
        .scp-card.safe { border-left-color: var(--success-green); }

        .scp-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 0.8rem;
        }

        .scp-title {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .class-badge {
            font-size: 0.75rem;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .class-badge.keter { background: rgba(255, 51, 51, 0.15); color: var(--danger-red); border: 1px solid var(--danger-red); }
        .class-badge.euclid { background: rgba(255, 170, 0, 0.15); color: var(--warning-amber); border: 1px solid var(--warning-amber); }
        .class-badge.safe { background: rgba(0, 255, 102, 0.15); color: var(--success-green); border: 1px solid var(--success-green); }

        .scp-instruction {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 1rem;
            margin-top: 0.8rem;
            border: 1px dashed var(--card-border);
        }

        .scp-instruction h4 {
            color: var(--primary-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Forms & Inputs */
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        .form-control {
            width: 100%;
            padding: 12px;
            background: #080a0f;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }
        .form-control:focus { border-color: var(--primary-blue); }

        /* Table */
        .table-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.92rem; }
        th, td { padding: 14px 18px; border-bottom: 1px solid var(--card-border); }
        th { background-color: rgba(0, 136, 255, 0.05); color: var(--primary-blue); text-transform: uppercase; font-size: 0.8rem; }

        .tag {
            background-color: rgba(0, 136, 255, 0.1);
            color: var(--primary-blue);
            border: 1px solid rgba(0, 136, 255, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .tag-danger {
            background-color: rgba(255, 51, 51, 0.1);
            color: var(--danger-red);
            border: 1px solid rgba(255, 51, 51, 0.3);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
        }

        .btn-submit {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn-submit:hover { background-color: var(--blue-hover); }

        .btn-danger {
            background-color: var(--danger-red);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.8rem;
        }

        footer {
            margin-top: 4rem;
            background-color: var(--card-bg);
            border-top: 1px solid var(--card-border);
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://ia801503.us.archive.org/15/items/SCPFoundationTheme/SCPFoundationTheme.mp3" type="audio/mpeg">
    </audio>

    <div class="holo-ticker">
        <div class="holo-ticker-content">
            ⚠️ MTF EPSILON-11 STATUS: ALERTTUFE ALPHA /// AKTUELLER SEKTOR-EINSATZ: SITE-19 CONTAINMENT BREACH /// NÄCHSTE EINHEITSBESPRECHUNG: SONNTAG 18:00 UHR ⚠️
        </div>
    </div>

    <header>
        <div class="brand">
            <i class="fa-solid fa-shield-cat" style="color: var(--primary-blue); font-size: 1.5rem;"></i>
            MTF Epsilon-11 "NTF"
        </div>

        <nav>
            <button class="nav-btn active" onclick="switchTab('startseite', this)"><i class="fa-solid fa-house"></i> Start</button>
            <button class="nav-btn" onclick="switchTab('untereinheiten', this)"><i class="fa-solid fa-sitemap"></i> Spezialisierungen</button>
            <button class="nav-btn" onclick="switchTab('scps', this)"><i class="fa-solid fa-biohazard"></i> SCP Datenbank</button>
            <button class="nav-btn" onclick="switchTab('planeten', this)"><i class="fa-solid fa-building-shield"></i> Sites & Einrichtungen</button>
            <button class="nav-btn" onclick="switchTab('mitglieder', this)"><i class="fa-solid fa-users"></i> Personal</button>
            <button class="nav-btn" onclick="switchTab('abmeldung', this)"><i class="fa-solid fa-calendar-minus"></i> Abmeldung</button>
            <button class="nav-btn" onclick="switchTab('blacklist', this)"><i class="fa-solid fa-ban"></i> Terminations & Bans</button>
            <button class="nav-btn" onclick="switchTab('regeln', this)"><i class="fa-solid fa-book"></i> Protokolle</button>
        </nav>

        <div class="header-controls">
            <button class="sound-toggle" onclick="toggleBackgroundMusic()" title="Ambience Ein/Aus" id="musicBtn">
                <i class="fa-solid fa-music"></i>
            </button>
            <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.01" value="0.3" oninput="changeVolume(this.value)">
